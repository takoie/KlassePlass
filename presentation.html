<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>KlassePlass Presentasjon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/desk-types.css">
  <style>
    body { background: var(--bg-app); overflow: hidden; }

    .pres-toolbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 48px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px; gap: 8px;
      z-index: 100;
      transition: opacity 0.3s ease;
    }
    .pres-toolbar.hidden-toolbar { opacity: 0; pointer-events: none; }
    body:hover .pres-toolbar.hidden-toolbar { opacity: 1; pointer-events: auto; }

    .canvas-outer {
      width: 100vw;
      height: calc(100vh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .pres-canvas {
      position: relative;
      transform-origin: top center;
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    /* Større fonter i presentasjons-modus */
    .pres-canvas .student-name { font-size: 13px; font-weight: 600; }
    .pres-canvas .desk { font-size: 13px; }

    /* High-contrast modus */
    .high-contrast .desk         { background: #000 !important; border: 2px solid #fff !important; }
    .high-contrast .student-name { color: #fff !important; font-size: 14px; }
    .high-contrast .front-board  { background: #fff !important; color: #000 !important; }

    /* Trekk-animasjon overlay */
    #draw-overlay {
      position: fixed; inset: 0;
      background: var(--bg-overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
    }
    #draw-card {
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 32px 48px;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: cardPop 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes cardPop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="canvas-outer" id="canvas-outer">
    <div class="pres-canvas" id="pres-canvas">
      <div id="pres-board" class="front-board board-top">TAVLE</div>
    </div>
  </div>

  <!-- Trekk-animasjon overlay (skjult som standard) -->
  <div id="draw-overlay" style="display:none">
    <div id="draw-card"></div>
  </div>

  <!-- Verktøylinje -->
  <div class="pres-toolbar" id="pres-toolbar">
    <button class="btn btn-ghost btn-sm" id="btn-zoom-in"    title="Zoom inn"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
    <button class="btn btn-ghost btn-sm" id="btn-zoom-out"   title="Zoom ut"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
    <button class="btn btn-ghost btn-sm" id="btn-zoom-reset" title="Tilbakestill zoom"><i class="fa-solid fa-expand"></i></button>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <button class="btn btn-ghost btn-sm" id="btn-toggle-names"   title="Vis/skjul navn"><i class="fa-solid fa-user"></i></button>
    <button class="btn btn-ghost btn-sm" id="btn-toggle-numbers" title="Vis/skjul numre"><i class="fa-solid fa-hashtag"></i></button>
    <button class="btn btn-ghost btn-sm" id="btn-high-contrast"  title="Høy kontrast"><i class="fa-solid fa-circle-half-stroke"></i></button>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <button class="btn btn-accent btn-sm" id="btn-draw-start" title="Start trekke-modus">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Trekk
    </button>
    <button class="btn btn-secondary btn-sm hidden" id="btn-draw-next" title="Trekk neste elev">
      Neste <i class="fa-solid fa-chevron-right"></i>
    </button>
    <button class="btn btn-ghost btn-sm hidden" id="btn-draw-all" title="Vis alle">
      Vis alle
    </button>
    <div style="flex:1"></div>
    <span id="pres-chart-name" style="font-size:13px;color:var(--text-secondary)"></span>
    <button class="btn btn-ghost btn-sm" id="btn-close" title="Lukk"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <script>
    // Presentation-vindu bruker CommonJS siden det er et separat Electron-vindu
    const { ipcRenderer } = require('electron');
    // Dynamisk import av ES-modules
    import('./src/views/presentation.js').then(m => m.init(ipcRenderer));
  </script>
</body>
</html>
