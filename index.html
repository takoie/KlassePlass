<!DOCTYPE html>
<html lang="no" data-theme="dracula">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KlassePlass</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {} },
      plugins: [],
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/canvas.css">
</head>
<body class="bg-base-100 text-base-content" style="height:100vh;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased">
  <div id="app" class="flex flex-col h-screen overflow-hidden">
    <!-- Title bar -->
    <div class="titlebar flex items-center justify-between px-3 h-8 bg-base-200 border-b border-base-300 flex-shrink-0" style="-webkit-app-region:drag">
      <span style="font-size:1.05rem;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-0.01em">
        <span style="color:#e0f2fe;text-shadow:0 0 10px rgba(59,130,246,0.8)">Klasse</span><span style="color:#fbbf24;text-shadow:0 0 15px #f59e0b">Plass</span>
      </span>
      <div class="flex gap-1" style="-webkit-app-region:no-drag">
        <button class="btn btn-ghost btn-xs btn-circle" onclick="window.api.minimizeWindow()" title="Minimer">
          <i class="fa-solid fa-minus text-xs"></i>
        </button>
        <button class="btn btn-ghost btn-xs btn-circle" onclick="window.api.maximizeWindow()" title="Maksimer">
          <i class="fa-regular fa-square text-xs"></i>
        </button>
        <button class="btn btn-ghost btn-xs btn-circle hover:btn-error" onclick="window.api.closeWindow()" title="Lukk">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Layout -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar nav -->
      <nav class="w-52 flex-shrink-0 bg-base-200 border-r border-base-300 flex flex-col py-2 gap-1">
        <div class="px-4 pb-3 mb-1 border-b border-base-300">
          <div style="font-size:0.95rem;font-weight:800;font-style:italic;text-transform:uppercase">
            <span style="color:#e0f2fe;text-shadow:0 0 8px rgba(59,130,246,0.6)">Klasse</span><span style="color:#fbbf24;text-shadow:0 0 10px #f59e0b">Plass</span>
          </div>
          <div class="text-xs text-base-content/50">Klasseromsplanlegger</div>
        </div>
        <div class="nav-item active" data-view="charts-dashboard" onclick="navTo('charts-dashboard')">
          <i class="fa-solid fa-grid-2 w-4 text-center"></i> Klassekart
        </div>
        <div class="nav-item" data-view="classes" onclick="navTo('classes')">
          <i class="fa-solid fa-users w-4 text-center"></i> Klasser
        </div>
        <div class="nav-item" data-view="rooms-list" onclick="navTo('rooms-list')">
          <i class="fa-solid fa-door-open w-4 text-center"></i> Rom
        </div>
        <div class="flex-1"></div>
        <div class="nav-item" data-view="settings" onclick="navTo('settings')">
          <i class="fa-solid fa-gear w-4 text-center"></i> Innstillinger
        </div>
      </nav>

      <!-- Main content -->
      <main id="app-content" class="flex-1 overflow-auto bg-base-100"></main>
    </div>

    <!-- Auto-update banner -->
    <div id="update-banner" class="hidden fixed bottom-4 right-4 bg-base-200 border border-base-300 rounded-xl p-3 shadow-xl flex items-center gap-3 z-50">
      <i class="fa-solid fa-arrow-up-from-bracket text-primary"></i>
      <span class="text-sm">Versjon <strong id="update-version"></strong> er klar</span>
      <button class="btn btn-primary btn-sm" onclick="window.api.restartApp()">Start på nytt</button>
      <button class="btn btn-ghost btn-sm btn-circle" onclick="this.closest('#update-banner').classList.add('hidden')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <style>
    .hidden { display: none !important; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 6px;
      margin: 0 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
      color: oklch(var(--bc) / 0.6);
    }
    .nav-item:hover { background: oklch(var(--b3)); color: oklch(var(--bc)); }
    .nav-item.active { background: oklch(var(--p) / 0.15); color: oklch(var(--p)); }
  </style>

  <script type="module" src="src/renderer.js"></script>
</body>
</html>
