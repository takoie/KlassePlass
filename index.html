<!DOCTYPE html>
<html lang="no" data-theme="dracula" style="background:transparent !important">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KlassePlass</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {} },
      plugins: [],
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/room-editor.css">
  <link rel="stylesheet" href="src/styles/classes.css">
  <link rel="stylesheet" href="src/styles/canvas.css">
</head>
<body class="text-base-content" style="height:100vh;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;background:transparent !important">
  <div id="app-shell" style="height:100vh;padding:8px;box-sizing:border-box;background:transparent">
  <div id="app" class="flex flex-col" style="height:100%;border-radius:14px;overflow:hidden;border:1px solid oklch(var(--b3)/0.8);box-shadow:0 24px 64px rgba(0,0,0,0.6)">
    <!-- Title bar — only window controls, no duplicate logo -->
    <div class="titlebar flex items-center justify-end px-2 flex-shrink-0 bg-base-200" style="-webkit-app-region:drag;height:28px;border-bottom:1px solid oklch(var(--b3)/0.5)">
      <div class="flex gap-1" style="-webkit-app-region:no-drag">
        <button class="win-btn win-btn-min" onclick="window.api.minimizeWindow()" title="Minimer">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="win-btn win-btn-max" onclick="window.api.maximizeWindow()" title="Maksimer">
          <i class="fa-regular fa-square"></i>
        </button>
        <button class="win-btn win-btn-close" onclick="window.api.closeWindow()" title="Lukk">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Layout -->
    <div class="flex flex-1 overflow-hidden bg-base-200">
      <!-- Sidebar nav -->
      <nav class="sidebar-nav flex-shrink-0 bg-base-200 flex flex-col" style="width:200px;border-right:1px solid oklch(var(--b3))">

        <!-- Logo -->
        <div class="sidebar-logo">
          <div style="font-size:1.2rem;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-0.02em">
            <span style="color:#e0f2fe;text-shadow:0 0 10px rgba(59,130,246,0.7)">Klasse</span><span style="color:#fbbf24;text-shadow:0 0 12px #f59e0b">Plass</span>
          </div>
        </div>

        <!-- Main nav group -->
        <div class="sidebar-section" style="flex:1">
          <div class="nav-group-box">
            <div class="nav-item active" data-view="charts-dashboard" onclick="navTo('charts-dashboard')">
              <i class="fa-solid fa-table-cells-large nav-icon"></i> Klassekart
            </div>
            <div class="nav-item" data-view="classes" onclick="navTo('classes')">
              <i class="fa-solid fa-user-group nav-icon"></i> Klasser
            </div>
            <div class="nav-item" data-view="rooms-list" onclick="navTo('rooms-list')">
              <i class="fa-solid fa-chalkboard nav-icon"></i> Rom
            </div>
          </div>
        </div>

        <!-- Settings group -->
        <div class="sidebar-section sidebar-bottom">
          <div class="nav-group-box">
            <div class="nav-item" data-view="settings" onclick="navTo('settings')">
              <i class="fa-solid fa-gear nav-icon"></i> Innstillinger
            </div>
          </div>
        </div>
      </nav>

      <!-- Main content — boxed with rounded corners -->
      <div class="flex-1 overflow-hidden" style="padding:8px 8px 8px 0;">
        <main id="app-content" class="bg-base-100 h-full"
          style="border-radius:10px;border:1px solid oklch(var(--b3)/0.6);box-shadow:0 2px 12px rgba(0,0,0,0.2);overflow:hidden;">
        </main>
      </div>
    </div>

    <!-- Auto-update banner -->
    <div id="update-banner" class="hidden fixed bottom-4 right-4 bg-base-200 border border-base-300 rounded-xl p-3 shadow-xl flex items-center gap-3 z-50">
      <i class="fa-solid fa-arrow-up-from-bracket text-primary"></i>
      <span class="text-sm">Versjon <strong id="update-version"></strong> er klar</span>
      <button class="btn btn-primary btn-sm" onclick="window.api.restartApp()">Start på nytt</button>
      <button class="btn btn-ghost btn-sm btn-circle" onclick="this.closest('#update-banner').classList.add('hidden')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div><!-- #app -->
  </div><!-- #app-shell -->

  <!-- Modal portal — outside #app so overflow:hidden cannot clip modals -->
  <div id="modal-portal"></div>

  <style>
    /* Force transparent background on html/body so rounded window corners show through */
    html, body { background: transparent !important; }

    .hidden { display: none !important; }

    /* Modal portal — plain container, no positioning so fixed children use viewport */
    #modal-portal { position: static; }

    /* Sidebar */
    .sidebar-logo {
      padding: 18px 16px 16px;
      border-bottom: 1px solid oklch(var(--b3));
      flex-shrink: 0;
    }
    .sidebar-section { padding: 10px 8px; }
    .sidebar-bottom { border-top: 1px solid oklch(var(--b3)); padding-top: 8px; padding-bottom: 8px; }

    /* Nav group box — subtle container around nav items */
    .nav-group-box {
      background: oklch(var(--b1) / 0.5);
      border: 1px solid oklch(var(--b3) / 0.5);
      border-radius: 10px;
      padding: 4px;
      overflow: hidden;
    }

    /* Nav items */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 7px;
      margin-bottom: 1px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      color: oklch(var(--bc) / 0.55);
    }
    .nav-item:last-child { margin-bottom: 0; }
    .nav-item:hover {
      background: oklch(var(--b3));
      color: oklch(var(--bc));
    }
    .nav-item.active {
      background: oklch(var(--p) / 0.18);
      color: oklch(var(--p));
      font-weight: 600;
    }
    .nav-icon {
      width: 16px;
      text-align: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* Window control buttons */
    .win-btn {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: oklch(var(--bc) / 0.4);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      transition: background 0.15s, color 0.15s;
    }
    .win-btn:hover { background: oklch(var(--b3)); color: oklch(var(--bc)); }
    .win-btn-close:hover { background: oklch(var(--er) / 0.2); color: oklch(var(--er)); }
  </style>

  <script type="module" src="src/renderer.js"></script>
</body>
</html>
