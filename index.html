<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KlassePlass</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/desk-types.css">
  <link rel="stylesheet" href="src/styles/seating-editor.css">
  <link rel="stylesheet" href="src/styles/room-editor.css">
</head>
<body>
  <div id="app">
    <!-- Title bar -->
    <div class="titlebar">
      <span class="titlebar-title" style="font-size:13px;font-weight:600;color:var(--text-secondary)">
        KlassePlass
      </span>
      <div class="titlebar-controls">
        <button class="titlebar-btn" onclick="window.api.minimizeWindow()" title="Minimer">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="titlebar-btn" onclick="window.api.maximizeWindow()" title="Maksimer">
          <i class="fa-regular fa-square"></i>
        </button>
        <button class="titlebar-btn close" onclick="window.api.closeWindow()" title="Lukk">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Layout -->
    <div style="display:flex;flex:1;overflow:hidden">
      <!-- Sidebar nav -->
      <nav class="sidebar">
        <div style="padding:8px 16px 16px;border-bottom:1px solid var(--border);margin-bottom:8px">
          <div style="font-size:15px;font-weight:700;color:var(--text-primary)">KlassePlass</div>
          <div style="font-size:11px;color:var(--text-muted)">Klasseromsplanlegger</div>
        </div>
        <div class="nav-item active" data-view="charts-dashboard" onclick="navTo('charts-dashboard')">
          <i class="fa-solid fa-grid-2"></i> Klassekart
        </div>
        <div class="nav-item" data-view="classes" onclick="navTo('classes')">
          <i class="fa-solid fa-users"></i> Klasser
        </div>
        <div class="nav-item" data-view="room-editor" onclick="navTo('room-editor')">
          <i class="fa-solid fa-door-open"></i> Rom
        </div>
        <div style="flex:1"></div>
        <div class="nav-item" data-view="settings" onclick="navTo('settings')">
          <i class="fa-solid fa-gear"></i> Innstillinger
        </div>
      </nav>

      <!-- Main content -->
      <main id="app-content" style="flex:1;overflow:auto;background:var(--canvas-bg)"></main>
    </div>

    <!-- Auto-update banner -->
    <div id="update-banner" class="hidden" style="
      position:fixed;bottom:16px;right:16px;
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--radius-md);padding:12px 16px;
      box-shadow:0 4px 16px rgba(0,0,0,0.3);
      display:flex;align-items:center;gap:12px;z-index:4000;
    ">
      <i class="fa-solid fa-arrow-up-from-bracket" style="color:var(--accent)"></i>
      <span style="font-size:13px">Versjon <strong id="update-version"></strong> er klar</span>
      <button class="btn btn-primary btn-sm" onclick="window.api.restartApp()">Start på nytt</button>
      <button class="btn btn-ghost btn-sm btn-icon" onclick="this.closest('#update-banner').classList.add('hidden')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <style>
    .hidden { display: none !important; }
  </style>

  <script type="module" src="src/renderer.js"></script>
</body>
</html>
